# TradingAI HTTP Reverse Proxy — canonical deployment template
# Deploy to: /etc/nginx/sites-available/tradingai
# Enable:    ln -s /etc/nginx/sites-available/tradingai /etc/nginx/sites-enabled/tradingai
# Validate:  sudo nginx -t
# Reload:    sudo systemctl reload nginx
#
# Per-environment configuration:
#   server_name — set to the deployment host's public IP or domain.
#   Defaults to catch-all "_" for portability.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /home/joe4410joe/tradingai_prod_v1/frontend/dist;
    index index.html;

    autoindex off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed Vite assets — immutable cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Backend API — preserve /api/ prefix
    #
    # Production transport policy (verified in Production 2026-09-16): public
    # observation is preserved (GET/HEAD/OPTIONS), while all API mutation
    # methods are restricted to the host loopback path by default. Authenticated
    # Operation control routes are re-allowed as exact, route-scoped POST/PUT
    # transports below. The backend remains the security authority (operator
    # session + CSRF + governance + MM + execution authority); nginx never
    # bypasses those checks. When Production changes this policy, keep the two
    # in sync.
    location /api/ {
        limit_except GET HEAD OPTIONS {
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Authenticated Operation Money Management configuration save (PUT).
    location ~ ^/api/money-management/configuration$ {
        limit_except GET HEAD OPTIONS PUT { deny all; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Authenticated Operation control + operator auth (POST).
    location ~ ^/api/(auth/(login|logout)|bot/(start|stop|control|manual-trade|loop/start|loop/stop|live-order-entry/(arm|disarm)|live-auto/(approve|start|stop)|paper-account/capital)|governance/(mode|execution|risk-profile|emergency-stop|emergency-orchestrate|emergency/unlock|emergency/retry)|runtime/(stopped-paper-safety/refresh|paper-auto/(start|cycle|stop)))$ {
        limit_except GET HEAD OPTIONS POST { deny all; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Authenticated read-only AI Advisor browser conversation (POST).
    location ~ ^/api/ai-advisor/conversation$ {
        limit_except GET HEAD OPTIONS POST { deny all; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend config endpoint
    location = /config {
        proxy_pass http://127.0.0.1:8001/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade
    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Deny sensitive repository paths
    location ~ /\.env       { return 404; }
    location ~ /\.git       { return 404; }
    location ~ ^/(docs/recovery|tmp/chatgpt_reviews|backend/|systemd/) { return 404; }
}
