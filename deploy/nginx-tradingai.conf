# TradingAI HTTP Reverse Proxy — canonical deployment template
# Deploy to: /etc/nginx/sites-available/tradingai
# Enable:    ln -s /etc/nginx/sites-available/tradingai /etc/nginx/sites-enabled/tradingai
# Validate:  sudo nginx -t
# Reload:    sudo systemctl reload nginx
#
# Per-environment configuration:
#   server_name — set to the deployment host's public IP or domain.
#   Defaults to catch-all "_" for portability.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /home/joe4410joe/tradingai_prod_v1/frontend/dist;
    index index.html;

    autoindex off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed Vite assets — immutable cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Backend API — preserve /api/ prefix
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Backend config endpoint
    location = /config {
        proxy_pass http://127.0.0.1:8001/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade
    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Deny sensitive repository paths
    location ~ /\.env       { return 404; }
    location ~ /\.git       { return 404; }
    location ~ ^/(docs/recovery|tmp/chatgpt_reviews|backend/|systemd/) { return 404; }
}
