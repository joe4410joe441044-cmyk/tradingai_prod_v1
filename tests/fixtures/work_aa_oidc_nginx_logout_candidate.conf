# CANDIDATE ONLY. Not installed. Nginx was not reloaded.
# Target file: /etc/nginx/sites-enabled/tradingai
# That path is a regular file, not a symlink to sites-available.
# Insert this block only inside:
#   listen 443 ssl;
#   server_name tradingai-joe.mooo.com;
# Place it immediately after the existing operation-control POST location
# and before location ~ ^/api/ai-advisor/conversation$
# Do not edit the /api/ limit_except block.
# Do not add this block to the IP vhost. That host is not the OAuth redirect host.
# Do not change TLS, port 80 redirects, or the upstream.

location = /api/observation/auth/oidc/logout {
    limit_except GET HEAD OPTIONS POST { deny all; }
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
